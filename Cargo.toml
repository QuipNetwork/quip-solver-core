[workspace]
resolver = "2"
members = ["crates/*"]
# quip-protocol-py is a PyO3 cdylib built by maturin (it needs a Python
# interpreter to link and run). It stays a workspace member so it shares
# [workspace.dependencies], but it is left out of default-members so a bare
# `cargo build` / `cargo test` skips it.
default-members = [
    "crates/quip-proto",
    "crates/quip-protocol",
    "crates/quip-solver-core",
    "crates/quip-solver-conformance",
]

[workspace.package]
version = "0.0.0-rc2"
edition = "2021"
license = "Apache-2.0"
repository = "https://gitlab.com/quip.network/quip-solver-core"
homepage = "https://quip.network"
readme = "README.md"

[workspace.lints.rust]
missing-docs          = "warn"
nonstandard-style     = "warn"
redundant-lifetimes   = "warn"
rust-2018-idioms      = "deny"
unreachable-pub       = "warn"
unsafe-code           = "deny"
unused-extern-crates  = "warn"
unused-imports        = "warn"
unused-must-use       = "warn"
unused-qualifications = "warn"
unused-results        = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Panic prevention
unwrap-used           = "deny"
expect-used           = "warn"
panic                 = "deny"
panic-in-result-fn    = "deny"
unimplemented         = "deny"
indexing-slicing      = "warn"
# No cheating
allow-attributes      = "deny"
# Code hygiene
dbg-macro             = "warn"
todo                  = "deny"
print-stdout          = "deny"
print-stderr          = "deny"
redundant-clone       = "warn"
uninlined-format-args = "warn"
manual-string-new     = "warn"
use-self              = "warn"
# Safety
await-holding-lock    = "deny"
large-futures         = "deny"
exit                  = "deny"
mem-forget            = "deny"
# Pedantic relaxations (too noisy)
module-name-repetitions = "allow"
similar-names           = "allow"

[workspace.lints.rustdoc]
all = "warn"

[workspace.dependencies]
# Internal crates carry a version alongside the path. Cargo builds against the
# path inside this workspace and swaps in the version when publishing, which is
# what lets crates.io resolve them. quip-solver-conformance is deliberately
# absent: it is only ever a dev-dependency, and versioning it would create a
# publish cycle with quip-protocol. See the note in crates/quip-protocol.
quip-proto = { path = "crates/quip-proto", version = "0.0.0-rc2" }
quip-protocol = { path = "crates/quip-protocol", version = "0.0.0-rc2" }
quip-solver-core = { path = "crates/quip-solver-core", version = "0.0.0-rc2" }

tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "io-util", "sync"] }
tonic-build = "0.12"
