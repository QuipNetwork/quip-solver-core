[package]
name = "quip-solver-c"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "C ABI over the Quip solver session loop: register a sampler callback and run"
# Ships as a build artifact (libquip_solver_c.so/.a plus quip_solver.h), not to
# crates.io. A C consumer wants the compiled library and header, not a crate.
publish = false

[lib]
name = "quip_solver_c"
crate-type = ["cdylib", "staticlib"]

[dependencies]
quip-solver-core = { workspace = true }
clap = { version = "4", features = ["derive"] }
# Already in the tree through quip-solver-core, which installs the subscriber.
# The C entry point reports a malformed identity through the same sink the
# session loop uses, so an operator reads one log, not two.
tracing = "0.1"

[build-dependencies]
cbindgen = "0.29"

# The C ABI boundary is the last crate that should be running on default lints.
# It takes the full workspace set, and `src/lib.rs` carries a single
# crate-level `#![expect(unsafe_code, ...)]` — the one rule this crate exists to
# break — so pedantic, `unwrap-used`, `panic`, and `indexing-slicing` all still
# apply to the code holding the raw pointers.
[lints]
workspace = true
