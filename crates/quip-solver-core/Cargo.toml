[package]
name = "quip-solver-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "The Quip solver contract: Sampler trait, Ising types, and the gRPC session loop"
keywords = ["quip", "solver", "ising", "annealing", "grpc"]
categories = ["network-programming", "science", "api-bindings"]

[lib]
name = "quip_solver_core"
path = "src/lib.rs"

[dependencies]
quip-proto = { workspace = true }
quip-protocol = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["net"] }
tower = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }
clap = { version = "4", features = ["derive"] }
getrandom = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already in the workspace tree via tonic 0.12. Same version; no new crate.
base64 = "0.22.1"

[dev-dependencies]
quip-solver-conformance = { path = "../quip-solver-conformance" }
# test-util: `start_paused` clocks only advance while every task is idle, which
# is how `writer_parks_when_the_read_loop_closes_before_the_sampler` detects a
# busy-spinning writer.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "test-util"] }

[lints]
workspace = true
