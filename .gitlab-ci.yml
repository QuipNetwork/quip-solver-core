# One pipeline per change. When a branch has an open merge request, only the
# merge request pipeline runs, so the merge request badge reflects the full
# gate. Branch pipelines still fire before a merge request exists, and tag
# pipelines always fire.
workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - test
  - validate
  - smoke
  - release
  # The three registries publish in order of how hard each is to undo, easiest
  # first, so a failure strands as little as possible.
  #
  #   npm    an unwanted version can be unpublished within 72 hours
  #   pypi   a release can be deleted, but its filenames can never be reused
  #   crates a version can only be yanked, never replaced or re-uploaded
  #
  # Every earlier attempt published the hardest one first and failed on the
  # easier ones behind it, which spent a version number that could not be
  # reclaimed. In this order the first failure stops everything after it.
  - pypi
  - crates
  - notes

variables:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Must match the protoc that generated npm/src/generated. See the wasm job.
  PROTOC_VERSION: "35.1"
  # sha256 of protoc-35.1-linux-x86_64.zip, as published in the GitHub release
  # asset digest for tag v35.1 and confirmed against the downloaded file. Bump
  # it together with PROTOC_VERSION; the release page carries the new digest.
  PROTOC_SHA256: "6930ebf62bd4ea607b98fff052596c6ee564b9835b4ce172c75a3f53ae9d91b7"
  # wasm-pack is installed from crates.io at a pinned version rather than
  # through the upstream `curl | sh` installer, which resolves whatever release
  # is current at pipeline time and is not checksummed.
  WASM_PACK_VERSION: "0.15.0"
  # The nodesource channel, asserted after install so a silent channel change
  # cannot leave an unexpected major on PATH.
  NODE_MAJOR: "24"
  # shfmt for the lint job. Pinned because a shfmt release can change the
  # formatting it considers canonical, which would fail the lint job on
  # untouched files. The sha256 is the GitHub release asset digest for
  # v3.13.1, confirmed against the downloaded binary.
  SHFMT_VERSION: "3.13.1"
  SHFMT_SHA256: "fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1"
  # uv fetches the Python interpreter for the macOS wheel job. Pinned by URL
  # rather than the floating installer, so an upstream release cannot land
  # mid-pipeline. Not checksummed, unlike protoc and shfmt above: astral.sh
  # publishes no per-version digest for install.sh.
  UV_VERSION: "0.12.10"

# ---------------------------------------------------------------------------
# Shared setup fragments.
#
# Referenced with `!reference` rather than YAML anchors so a job can compose
# several of them inside one before_script, which anchors cannot do.
# ---------------------------------------------------------------------------

# Pin protoc rather than taking the distro package. ts-proto stamps the protoc
# version into the generated header, so an unpinned compiler trips the stub
# drift guard on the version line alone. Bump PROTOC_VERSION and regenerate
# npm/src/generated together, the same way the Python guard pins grpcio-tools.
.setup-protoc:
  script:
    - apt-get update && apt-get install -y --no-install-recommends curl unzip make
    - curl -fsSLo /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip
    # Verify before unzipping. protoc generates the wire types every artifact
    # in this repository is built from, so a substituted compiler would be
    # signed and published by the release jobs downstream.
    - echo "${PROTOC_SHA256}  /tmp/protoc.zip" | sha256sum -c -
    - unzip -q -o /tmp/protoc.zip -d /usr/local
    - protoc --version

# Adds the wasm32 target without letting rustup re-sync the whole toolchain.
#
# rust-toolchain.toml pins a channel and names clippy and rustfmt. The rust
# image already ships both, so a plain `rustup target add` triggers a channel
# sync that tries to reinstall rustfmt and dies on `detected conflict:
# bin/cargo-fmt`. RUSTUP_TOOLCHAIN pins the already-installed toolchain and
# makes rustup ignore the file, so only the missing target is fetched.
.setup-wasm:
  script:
    - export RUSTUP_TOOLCHAIN=1.97.1
    - rustup target add wasm32-unknown-unknown
    # `cargo install` at a pinned version, not the upstream `curl | sh`
    # installer. The installer is unversioned and unchecksummed, so it fetched
    # whatever release was current when the pipeline ran, and a pipe to sh hides
    # a download failure behind sh's exit status. --locked builds wasm-pack
    # against its own committed lock file.
    - cargo install wasm-pack --version "${WASM_PACK_VERSION}" --locked
    - wasm-pack --version

.setup-node:
  script:
    # One block with pipefail, because `curl ... | bash -` reports only bash's
    # status. bash reading an empty stdin exits 0, so a failed or truncated
    # download left the pipeline believing the repository had been added and
    # failed later, somewhere unrelated.
    - |
      set -euo pipefail
      curl -fsSL "https://deb.nodesource.com/setup_${NODE_MAJOR}.x" | bash -
    - apt-get install -y --no-install-recommends nodejs
    - node --version
    # Assert the major rather than printing it. The nodesource script is what
    # chooses the version, so this is the only place that can catch it
    # installing something other than what the jobs below assume.
    - |
      set -euo pipefail
      HAVE="$(node --version)"
      if [ "${HAVE%%.*}" != "v${NODE_MAJOR}" ]; then
          echo "expected node ${NODE_MAJOR}.x, got ${HAVE}" >&2
          exit 1
      fi

# The contract must build with no device present. That is the test for what
# belongs in this repository: anything needing special hardware to build
# belongs in a solver repository instead.
rust:
  stage: test
  image: rust:1.97.1
  tags: [linux, amd64]
  before_script:
    # make, because the script below calls the Makefile. python3, because
    # `make test` clippy-checks quip-protocol-py and the pyo3 build script
    # probes an interpreter even for a check-only build.
    - apt-get update && apt-get install -y --no-install-recommends protobuf-compiler make python3
    - rustup component add clippy rustfmt
  script:
    # `make test`, not the commands inline. They used to be copied here and had
    # drifted: the Makefile excluded quip-protocol-wasm from clippy and test
    # while this job did not, so a local `make test` and a green pipeline no
    # longer meant the same thing. One definition, in the Makefile.
    - make test

# The shell and Python linters. Rust is covered by the rust job through
# `make test`, and TypeScript by the wasm job, which runs tsc under
# `strict: true` as part of `npm run build`.
#
# Runs the same `make lint` a developer runs, for the same reason the rust job
# runs `make test`.
lint:
  stage: test
  image: python:3.11
  tags: [linux, amd64]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends make shellcheck
    # shfmt is not packaged in bookworm at a version worth pinning to, so it
    # comes from the upstream release, checksummed the same way protoc is.
    # Pinned: ruff's default rule set grows between minors, so an unpinned
    # install turns upstream releases into red pipelines. Bump deliberately
    # and fix the new findings in the same change.
    - pip install --quiet ruff==0.16.2
    - |
      set -euo pipefail
      curl -fsSLo /usr/local/bin/shfmt \
        "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
      echo "${SHFMT_SHA256}  /usr/local/bin/shfmt" | sha256sum -c -
      chmod +x /usr/local/bin/shfmt
    - shfmt --version
  script:
    - make lint

docs:
  stage: test
  image: rust:1.97.1
  tags: [linux, amd64]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends protobuf-compiler
  script:
    - RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace --exclude quip-protocol-py

conformance:
  stage: test
  image: python:3.11
  tags: [linux, amd64]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends protobuf-compiler
    - python -m venv .venv
    - . .venv/bin/activate
    # Pin grpcio-tools so the stub drift guard stays deterministic. The
    # checked-in python/quip/v1/*_pb2.py were generated with 1.82.1 (protoc
    # gencode 7.35.0). A newer grpcio-tools stamps a different gencode version
    # and trips the diff. Bump this pin and regenerate the stubs together.
    - pip install maturin "grpcio-tools==1.82.1"
    # Download, then run. Piping the installer into sh reports only sh's exit
    # status, and sh reading an empty stdin exits 0, so a failed download left
    # this job continuing without a Rust toolchain.
    - |
      set -euo pipefail
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
      sh /tmp/rustup-init.sh -y --profile minimal
    - . "$HOME/.cargo/env"
    - maturin develop -E dev
  script:
    # Proto and stub drift guard: regenerate from the normative .proto and fail
    # if the checked-in copies are stale.
    - |
      set -e
      TMP=$(mktemp -d)
      python -m grpc_tools.protoc \
        -I proto \
        --python_out="$TMP" \
        --grpc_python_out="$TMP" \
        proto/quip/v1/miner.proto
      diff -u python/quip/v1/miner_pb2.py "$TMP/quip/v1/miner_pb2.py"
      diff -u python/quip/v1/miner_pb2_grpc.py "$TMP/quip/v1/miner_pb2_grpc.py"
    - python -m pytest conformance/ -v

# The npm package carries the consensus math as WebAssembly rather than a second
# implementation, so this job proves the wasm build reproduces the same golden
# vectors the Rust tests use. A JavaScript solver that disagrees with Rust about
# an energy score would be rejected by the network, so this is a release gate.
wasm:
  stage: test
  image: rust:1.97.1
  tags: [linux, amd64]
  before_script:
    - !reference [.setup-protoc, script]
    - !reference [.setup-node, script]
    - !reference [.setup-wasm, script]
  script:
    - cd npm
    - npm ci
    # Stub drift guard, matching the Python and Rust ones: regenerate the
    # TypeScript stubs from the normative .proto and fail if they are stale.
    - cp -r src/generated /tmp/generated-committed
    - npm run build:stubs
    - diff -ru /tmp/generated-committed src/generated
    - npm run build
    - npm test

# ---------------------------------------------------------------------------
# Smoke tests.
#
# Each job installs one built artifact into a clean container and runs that
# language's sample solver against it. Nothing here builds a dependency from
# the source tree, so these test what a consumer actually receives rather than
# what this repository happens to have on disk.
#
# All four run on every pipeline, and the publish jobs need them, so a
# regression in a shipped artifact stops the release rather than reaching a
# registry. This is the reason the samples exist.
# ---------------------------------------------------------------------------

.smoke:
  stage: smoke
  tags: [linux, amd64]
  needs:
    - job: release:validate
      artifacts: true
  timeout: 30m

# Builds against the PACKAGED crates, unpacked from the .crate tarballs, rather
# than against crates/. [patch.crates-io] redirects the registry dependency to
# the unpacked package, so a file missing from the tarball fails here instead
# of after publication. This is also what lets the smoke test run before the
# version exists on crates.io.
smoke:rust:
  extends: .smoke
  image: rust:1.97.1
  before_script:
    - !reference [.setup-protoc, script]
  script:
    - mkdir -p /opt/pkg && for f in target/package/*.crate; do tar xzf "$f" -C /opt/pkg; done
    - ls /opt/pkg
    - |
      {
        echo
        echo '[patch.crates-io]'
        for d in /opt/pkg/*/; do
          name=$(basename "${d%/}" | sed -E 's/-[0-9]+\.[0-9]+\.[0-9]+.*$//')
          echo "$name = { path = \"${d%/}\" }"
        done
      } >> examples/rust/Cargo.toml
    - tail -8 examples/rust/Cargo.toml
    - (cd examples/rust && cargo build --release)
    - ./quip-solver-drive examples/rust/target/release/mock_miner unix:///tmp/rust.sock

# Compiles against the released tarball's header and library only. The repo's
# target/ is never on the include or link path, so a header that does not match
# the shipped object fails here.
smoke:cpp:
  extends: .smoke
  image: rust:1.97.1
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends g++ make
  script:
    - mkdir -p /opt/clib && tar xzf quip-solver-clib-*.tar.gz -C /opt/clib
    - ls -R /opt/clib
    - g++ -std=c++17 -O2 -Wall -Wextra -I/opt/clib/include examples/cpp/mock_miner.cpp
      -o /tmp/mock_miner_cpp -L/opt/clib -Wl,-rpath,/opt/clib -lquip_solver_c -lpthread -ldl -lm
    - ./quip-solver-drive /tmp/mock_miner_cpp unix:///tmp/cpp.sock

# Installs the built wheel into a fresh virtual environment. The example
# imports quip_solver_core from site-packages, not from python/ in this tree.
smoke:python:
  extends: .smoke
  image: python:3.11
  script:
    - python -m venv /opt/venv
    - /opt/venv/bin/pip install --quiet dist/python/*.whl
    - /opt/venv/bin/python -c "import quip_solver_core; print('quip_solver_core from', quip_solver_core.__file__)"
    - printf '#!/bin/sh\nexec /opt/venv/bin/python %s/examples/python/mock_miner.py "$@"\n' "$PWD" > /tmp/py_miner
    - chmod +x /tmp/py_miner
    - ./quip-solver-drive /tmp/py_miner unix:///tmp/python.sock

# Installs the packed tarball into a clean project. The example resolves
# @quip.network/quip-solver-core from node_modules, not from npm/ in this tree.
smoke:typescript:
  extends: .smoke
  # The rust image plus node, not the node image: quip-solver-drive is built on
  # rust:1.97.1 and links glibc 2.39, which node:24 does not carry. The npm
  # package is still installed from the packed tarball, so the isolation that
  # matters is unaffected.
  image: rust:1.97.1
  before_script:
    - !reference [.setup-node, script]
  script:
    - mkdir -p /opt/ts && cp -r examples/typescript/src examples/typescript/tsconfig.json examples/typescript/package.json /opt/ts/
    - cd /opt/ts
    - npm install "$CI_PROJECT_DIR"/npm/quip.network-quip-solver-core-*.tgz
    - npm install
    - npx tsc
    - printf '#!/bin/sh\nexec node /opt/ts/dist/mock_miner.js "$@"\n' > /tmp/ts_miner
    - chmod +x /tmp/ts_miner
    - cd "$CI_PROJECT_DIR"
    - ./quip-solver-drive /tmp/ts_miner unix:///tmp/typescript.sock

# ---------------------------------------------------------------------------
# Release pipeline.
#
# The dry run always runs. The real publish runs only on a tag.
#
#   release:validate  every pipeline. Dry-runs all four publish paths.
#   release:crates    tag only. Publishes the four crates to crates.io.
#   release:pypi      tag only. Publishes the wheel and sdist to PyPI.
#   release:npm       tag only. Publishes the npm package.
#   release:clib      tag only. Packs the C library as a release asset.
#   release:notes     tag only. Creates the release page, once all of the
#                     above are live.
#
# release:validate carries no `rules:`, so it runs on merge requests and
# branches as well as tags. A broken release setup then fails on a merge
# request instead of halfway through a release, with some registries written
# and others not. It writes to no registry: every step is a dry run or a local
# build, and `make check-release` runs the same steps locally.
#
# The three publish jobs stay separate rather than merging into one, because
# retry granularity differs per registry. cargo hard-fails on an
# already-published version and has no --skip-existing, so a single job that
# published the crates and then died on the wheel upload could not be re-run.
#
# No CI/CD variables and no stored secrets. All three registries use OIDC
# trusted publishing, so each pipeline proves its own identity and receives a
# short-lived token.
#
# Every registry needs its publisher registered once against:
#
#   namespace  quip.network
#   project    quip-solver-core
#   pipeline   .gitlab-ci.yml
#   environment  as named on the job below (crates-io, pypi, npm)
#
# crates.io needs one registration per crate, at
# crates.io/crates/<name>/settings: quip-proto, quip-protocol,
# quip-solver-core, quip-solver-conformance. Its GitLab support is public beta
# and gitlab.com only.
#
# Protected tag pattern `v*` already exists, which is what keeps these
# environments reachable only from a Maintainer-pushed tag.
# ---------------------------------------------------------------------------

# Anchored to a full version with an optional prerelease. The old `/^v\d/`
# accepted any tag that started with `v` and a digit, so a malformed tag such
# as `v0.0.1-typo x` started the whole publish sequence and failed only at
# scripts/check-release-version.py. Keep this pattern and the one in
# release:tag-guard identical.
.on-release-tag: &on-release-tag
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$/

# Fails the pipeline of a tag that does not name a release. Without this, a
# tag outside the pattern above (for example `0.0.2`, missing the `v`) skips
# every release job while release:validate runs and passes: a green pipeline
# that published nothing.
release:tag-guard:
  stage: validate
  # python:3.11 because the runners already cache it for the lint and
  # conformance jobs. The script is two echoes and an exit.
  image: python:3.11
  tags: [linux, amd64]
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$/
  needs: []
  dependencies: []
  script:
    - echo "Tag '$CI_COMMIT_TAG' does not match v<major>.<minor>.<patch>[-<prerelease>], so no release job runs."
    - echo "Delete the tag, then push one shaped like v0.0.1 or v0.0.1-rc2."
    - exit 1

# Runs on every pipeline. This is the gate everything downstream hangs off.
#
# It writes to no registry: every step is a dry run or a local build, and
# `make check-release` runs the same steps locally. Its artifacts are the exact
# files the publish jobs would upload, which is what lets the smoke jobs test
# the real thing instead of a rebuild.
release:validate:
  stage: validate
  image: rust:1.97.1
  tags: [linux, amd64]
  # No `rules:` on purpose. See the header: the dry run always runs.
  #
  # `needs:` starts a job as soon as its own needs are met and ignores stage
  # order, so a job left off this list is not waited for at all. conformance
  # and docs were missing, which meant a tag could reach all three registries
  # while the Python conformance suite and the stub drift guard were still
  # running, or had already failed.
  #
  needs:
    - job: rust
    - job: wasm
    - job: conformance
    - job: docs
    - job: lint
  # Without this GitLab downloads every prior stage's artifacts by default.
  dependencies: []
  timeout: 60m
  before_script:
    - !reference [.setup-protoc, script]
    - !reference [.setup-node, script]
    - apt-get install -y --no-install-recommends python3 python3-venv python3-pip
    # A virtual environment rather than --break-system-packages: pip cannot
    # uninstall Debian's `packaging` (no RECORD file), so installing twine into
    # the system interpreter fails outright.
    - python3 -m venv /opt/buildenv
    - export PATH="/opt/buildenv/bin:$PATH"
    - pip install --quiet maturin twine
    - !reference [.setup-wasm, script]
  script:
    # The C library tarball carries the tag in its name on a tag pipeline, and
    # the short SHA otherwise, so a branch artifact is never mistaken for a
    # release one.
    - export TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    # On a tag pipeline the tag IS the version, so the three manifests must
    # already agree with it. Checked here, before anything is built, because
    # this is the last point where the answer costs nothing: a mismatch found
    # after release:npm has run has already spent a version number.
    - |
      set -euo pipefail
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
          python3 scripts/check-release-version.py "$CI_COMMIT_TAG"
      else
          echo "Not a tag pipeline; skipping the tag/manifest version check."
      fi
    - make check-release TAG="$TAG"
    - mv dist/quip-solver-clib-*.tar.gz dist/quip-solver-clib-*.tar.gz.sha256 .
    # The smoke jobs drive the samples with this, rather than each rebuilding
    # the Rust workspace.
    - cargo build -p quip-solver-conformance --bin quip-solver-drive --release
    - cp target/release/quip-solver-drive .
  artifacts:
    name: "quip-artifacts-${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    paths:
      - target/package/*.crate
      - dist/python/*.whl
      - dist/python/*.tar.gz
      - npm/*.tgz
      - quip-solver-clib-*.tar.gz
      - quip-solver-clib-*.tar.gz.sha256
      - quip-solver-drive
    expire_in: 1 week

# ---------------------------------------------------------------------------
# Platform wheels.
#
# release:validate builds the linux/amd64 wheel; these build the other
# platforms consumers run (Apple Silicon machines, arm64 Linux containers).
# Both feed release:pypi, so a broken platform build stops the release
# instead of shipping an amd64-only version, and both run on every pipeline
# for the same reason release:validate does: a regression should surface on
# the merge request, not on the tag.
#
# Neither installs protoc: the wheel's crate chain (quip-protocol-py ->
# quip-protocol -> quip-proto) has no build script; protoc is only a
# dev-dependency of the stub drift guard test.
# ---------------------------------------------------------------------------

# Native arm64 build on the group's arm64 docker runner. Produces
# manylinux_2_34_aarch64, the same glibc floor as the amd64 wheel.
wheel:linux-aarch64:
  stage: validate
  image: rust:1.97.1
  tags: [arm64, docker]
  needs: []
  timeout: 30m
  variables:
    # Use the image's toolchain as shipped. Without this, rust-toolchain.toml
    # makes rustup add clippy and rustfmt, which the wheel build never runs,
    # and on one arm64 runner that install fails on a bin/cargo-fmt conflict.
    RUSTUP_TOOLCHAIN: "1.97.1"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends python3 python3-venv
    - python3 -m venv /opt/wheelenv
    - /opt/wheelenv/bin/pip install --quiet maturin
  script:
    - /opt/wheelenv/bin/maturin build --release --out dist/python
    - /opt/wheelenv/bin/pip install --quiet dist/python/*.whl
    - /opt/wheelenv/bin/python -c "import quip, quip_solver_core; print(quip_solver_core.__file__)"
  artifacts:
    paths:
      - dist/python/*.whl
    expire_in: 1 week

# The macOS wheel cannot be cross-compiled from Linux: PyO3 needs the Apple
# linker and SDK. Runs on the group's Apple Silicon shell runners, where
# `image:` does not apply and a container-flavoured before_script would fail,
# so the job carries its own (same pattern as quip-miner-dwave's macOS build).
wheel:macos-arm64:
  stage: validate
  tags: [macos, arm64]
  needs: []
  timeout: 30m
  variables:
    # --no-modify-path below: CARGO_HOME sits inside the build directory, so
    # the `source $CARGO_HOME/env` line rustup appends to the runner's shell
    # profile would break every later login shell once the job's directory is
    # cleaned up.
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  before_script:
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.97.1 --no-modify-path
    - source "$CARGO_HOME/env"
    # The runner's system python3 sits below the >= 3.11 floor, and Homebrew is
    # the wrong way to clear it on a shared runner. `brew install` writes into
    # the Homebrew prefix even for a formula already present, so it fails on any
    # host whose prefix belongs to another user, and on `cray` brew is not on
    # the runner user's non-interactive PATH at all. uv fetches a
    # python-build-standalone interpreter into $HOME instead, so prefix
    # ownership stops mattering and a new macos+arm64 host needs no preparation.
    # quip-miner-dwave made this same move in !35 after three tags died on it.
    #
    # Always install, never "install only if missing": that guard exists for
    # brew's shared prefix, and skipping here would leave whatever uv the host
    # already carries, which defeats the pin.
    - export PATH="$HOME/.local/bin:$PATH"
    - curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
    - uv --version
    # uv downloads 3.12 when the host does not already have it. --seed because
    # a uv venv carries no pip, and the lines below drive .venv-wheel/bin/pip.
    - uv venv --seed --python 3.12 .venv-wheel
    - .venv-wheel/bin/pip install --quiet maturin
  script:
    # Shell executor: the workspace persists between jobs, and dist/ is
    # gitignored, so a stale wheel from a previous run would otherwise ride
    # along in the artifacts.
    - rm -rf dist/python
    - .venv-wheel/bin/maturin build --release --out dist/python
    - .venv-wheel/bin/pip install --quiet dist/python/*.whl
    - .venv-wheel/bin/python -c "import quip, quip_solver_core; print(quip_solver_core.__file__)"
  artifacts:
    paths:
      - dist/python/*.whl
    expire_in: 1 week

release:crates:
  stage: crates
  image: rust:1.97.1
  tags: [linux, amd64]
  <<: *on-release-tag
  # Depends on the other two registries, not only on the gates. This is the
  # irreversible publish, so it must not run until the reversible ones have
  # succeeded.
  needs:
    - job: release:validate
      artifacts: true
    - job: smoke:rust
    - job: smoke:cpp
    - job: smoke:python
    - job: smoke:typescript
    - job: release:npm
    - job: release:pypi
  environment:
    name: crates-io
    url: https://crates.io/crates/quip-solver-core
  # Trusted publishing, so no long-lived token is stored. The audience must be
  # the literal `crates.io`.
  id_tokens:
    CRATES_IO_ID_TOKEN:
      aud: crates.io
  timeout: 30m
  before_script:
    - !reference [.setup-protoc, script]
    - apt-get install -y --no-install-recommends jq
  script:
    # Exchange the GitLab OIDC token for a 30-minute crates.io token.
    #
    # Assignment and export are separate statements. `export VAR=$(cmd)` takes
    # its exit status from `export`, which succeeds whatever the command did, so
    # a rejected token exchange used to continue to `cargo publish` with an
    # empty token and fail there with an authentication error instead of the
    # script's own diagnostic.
    - CARGO_REGISTRY_TOKEN="$(bash scripts/exchange-crates-token.sh)"
    - export CARGO_REGISTRY_TOKEN
    # Cargo resolves the inter-crate order itself and waits for the index
    # between uploads. The three publish = false crates are skipped.
    - cargo publish --locked --workspace

release:pypi:
  stage: pypi
  # A plain Python image, because this job no longer builds anything. It
  # promotes the wheel and sdist release:validate built and smoke:python
  # installed and ran. Rebuilding here would have uploaded artifacts that no
  # smoke test ever exercised, from a `:latest` image that could differ from the
  # one the gate used, which is the same mistake release:clib already avoids.
  image: python:3.11
  tags: [linux, amd64]
  <<: *on-release-tag
  # Waits for npm, the one registry whose publish can still be undone.
  needs:
    - job: release:validate
      artifacts: true
    - job: wheel:linux-aarch64
      artifacts: true
    - job: wheel:macos-arm64
      artifacts: true
    - job: smoke:rust
    - job: smoke:cpp
    - job: smoke:python
    - job: smoke:typescript
    - job: release:npm
  # Matches the environment registered on the PyPI trusted publisher. PyPI
  # rejects the OIDC exchange when the two disagree.
  environment:
    name: pypi
    url: https://pypi.org/project/quip-solver-core/
  # The audience must be the literal `pypi`, not `pypi.org`.
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  timeout: 30m
  script:
    - python3 -m pip install --disable-pip-version-check twine
    # The wheel and sdist arrive as release:validate's artifacts. Nothing here
    # writes to dist/python, so what is uploaded is byte for byte what
    # smoke:python installed and ran the sample solver against.
    - ls -la dist/python/
    - twine check dist/python/*
    # Exchange the short-lived GitLab token for a PyPI API token. The endpoint
    # is single-use per token, so this mints once and uploads once.
    #
    # Minted in-process by python3 rather than by curl. The OIDC token is a
    # live credential, and `curl -d "{...token...}"` put it in a process
    # argument list, readable through /proc and echoed by any shell trace. Here
    # it is read from the environment and never becomes an argument.
    - |
      set -euo pipefail
      MINTED=$(python3 - <<'PY'
      import json
      import os
      import urllib.request

      request = urllib.request.Request(
          "https://pypi.org/_/oidc/mint-token",
          data=json.dumps({"token": os.environ["PYPI_ID_TOKEN"]}).encode(),
          headers={"Content-Type": "application/json"},
      )
      with urllib.request.urlopen(request) as response:
          print(json.load(response)["token"])
      PY
      )
      # --skip-existing so a re-run after a partial failure is safe. cargo has
      # no equivalent, which is why the registries are separate jobs.
      # --verbose because twine prints the HTTP status and hides the body. The
      # rc3 upload created the project from the wheel and then failed the sdist
      # with a bare "400 Bad Request", which says nothing about the cause.
      TWINE_USERNAME=__token__ TWINE_PASSWORD="$MINTED" twine upload --verbose --skip-existing dist/python/*
  artifacts:
    paths:
      - dist/python/*.whl
      - dist/python/*.tar.gz
    expire_in: never

release:npm:
  stage: release
  # Kept on the rust image only because .setup-node expects a Debian base with
  # curl already present. Nothing in this job compiles Rust any more.
  image: rust:1.97.1
  tags: [linux, amd64]
  <<: *on-release-tag
  needs:
    - job: release:validate
      artifacts: true
    - job: smoke:rust
    - job: smoke:cpp
    - job: smoke:python
    - job: smoke:typescript
  environment:
    name: npm
    url: https://www.npmjs.com/package/@quip.network/quip-solver-core
  # NPM_ID_TOKEN authenticates the publish. SIGSTORE_ID_TOKEN signs a
  # provenance attestation, which this job disables because npm accepts one
  # only from a GitLab-hosted runner. It stays declared so that moving this job
  # to a hosted runner is the only change needed to restore provenance.
  id_tokens:
    NPM_ID_TOKEN:
      aud: npm:registry.npmjs.org
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  timeout: 30m
  before_script:
    # No protoc and no wasm toolchain. This job publishes the tarball
    # release:validate packed, so it builds nothing and needs only node and npm.
    - !reference [.setup-node, script]
    # 11.5.1 is the floor for OIDC trusted publishing.
    - npm install -g npm@latest
  script:
    # Preflight, because npm reports a rejected or missing OIDC token as
    # ENEEDAUTH: "You need to authorize this machine using `npm login`". That
    # message names a missing password, so it sends you looking for a token
    # that this pipeline deliberately does not have. Assert the preconditions
    # from the npm docs here, and the remaining cause is the registry-side
    # trusted publisher configuration.
    - |
      set -euo pipefail
      # sort -V puts the lower version first. If that is not the floor, what is
      # installed is below it. An equal version sorts first and passes.
      require_min() {
          local what="$1" have="$2" want="$3"
          if [ "$(printf '%s\n%s\n' "$want" "$have" | sort -V | head -n1)" != "$want" ]; then
              echo "$what $have is below the $want that npm trusted publishing requires." >&2
              exit 1
          fi
      }
      NODE_HAVE="$(node --version)"
      NPM_HAVE="$(npm --version)"
      echo "node ${NODE_HAVE}, npm ${NPM_HAVE}"
      require_min node "${NODE_HAVE#v}" 22.14.0
      require_min npm "${NPM_HAVE}" 11.5.1
      : "${NPM_ID_TOKEN:?NPM_ID_TOKEN is unset. Declare it under id_tokens: with aud: npm:registry.npmjs.org}"
      echo "NPM_ID_TOKEN is present (${#NPM_ID_TOKEN} chars)."
    - cd npm
    # Exactly one tarball, or the glob below would publish an arbitrary one.
    # release:validate packs it after `rm -f ./*.tgz`, so a second file here
    # means the artifact set is not what this job expects.
    - |
      set -euo pipefail
      set -- ./quip.network-quip-solver-core-*.tgz
      if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
          echo "expected exactly one packed tarball, found: $*" >&2
          exit 1
      fi
      TARBALL="$1"
      export TARBALL
      echo "publishing $TARBALL"
    # Derive the dist-tag from the version rather than hard-coding `latest`.
    #
    # A hard-coded --tag latest moved `latest` onto whatever was published
    # last, so tagging an rc after a stable release made the prerelease the
    # default install for everyone running a bare `npm install`. A semver
    # prerelease is exactly a version with a hyphen after the version core.
    #
    # The flag stays mandatory either way: npm refuses to publish a prerelease
    # with no --tag at all, and the tag cannot be moved afterwards, because
    # OIDC authorises `npm publish` and `npm stage publish` and nothing else.
    # `npm dist-tag add` would need a stored npm token, and this pipeline holds
    # no registry secrets.
    - |
      set -euo pipefail
      VERSION="${CI_COMMIT_TAG#v}"
      case "$VERSION" in
          *-*) DIST_TAG="next" ;;
          *) DIST_TAG="latest" ;;
      esac
      export DIST_TAG
      echo "version $VERSION publishes under dist-tag $DIST_TAG"
    # Publishing the packed tarball, not the directory.
    #
    # `npm publish` on a directory reruns prepack, which reruns wasm-pack and
    # tsc, so the published package was a fresh build that no smoke test had
    # seen. Publishing the tarball skips prepack entirely, which makes this a
    # promotion of the artifact smoke:typescript installed and drove, the same
    # way release:clib promotes the tarball smoke:cpp compiled against.
    #
    # --no-provenance is required, not a preference. npm turns provenance on by
    # itself when publishing through trusted publishing, and npm only accepts a
    # provenance bundle from a GitLab-hosted runner. Every runner here is
    # self-hosted, so npm signs the bundle, sends it, and the registry rejects
    # the publish with 422 "Unsupported GitLab CI runner environment". Dropping
    # the explicit --provenance flag was not enough, because the default is not
    # what applies under trusted publishing.
    #
    # Restoring provenance means moving this one job to a GitLab-hosted runner.
    # It changes nothing about the published package otherwise.
    - npm publish "$TARBALL" --tag "$DIST_TAG" --no-provenance

# The C library ships as a release asset rather than through a registry,
# because a C consumer wants the compiled object and the header.
#
# This job promotes the tarball release:validate already built and smoke:cpp
# already compiled against. It does not rebuild: republishing a fresh build
# would attach an object no smoke test ever exercised.
release:clib:
  stage: release
  image: rust:1.97.1
  tags: [linux, amd64]
  <<: *on-release-tag
  needs:
    - job: release:validate
      artifacts: true
    - job: smoke:rust
    - job: smoke:cpp
    - job: smoke:python
    - job: smoke:typescript
  timeout: 10m
  script:
    - sha256sum -c quip-solver-clib-*.tar.gz.sha256
    - ls -la quip-solver-clib-*
  artifacts:
    name: "quip-solver-clib-$CI_COMMIT_TAG"
    paths:
      - quip-solver-clib-*.tar.gz
      - quip-solver-clib-*.tar.gz.sha256
    expire_in: never

# Runs last so the release page appears only once every artifact is live. A
# release pointing at a package that failed to publish is worse than no
# release. Uses the declarative `release:` keyword, so CI_JOB_TOKEN is enough
# and a re-run does not error when the release already exists.
release:notes:
  stage: notes
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags: [linux, amd64]
  <<: *on-release-tag
  needs:
    - job: release:crates
    - job: release:pypi
    - job: release:npm
    - job: release:clib
      artifacts: true
  timeout: 15m
  script:
    - echo "Creating the release page for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Quip solver contract $CI_COMMIT_TAG"
    description: |
      Quip solver contract $CI_COMMIT_TAG.

      | Artifact | Where |
      | -- | -- |
      | `quip-solver-core`, `quip-protocol`, `quip-proto`, `quip-solver-conformance` | crates.io |
      | `quip-solver-core` wheel | PyPI |
      | `@quip.network/quip-solver-core` | npm |
      | `libquip_solver_c` plus `quip_solver.h` | attached below |

      See CHANGELOG.md for the changes in this version, and examples/ for a
      conformant sample solver in Rust, C++, Python, and TypeScript.
    assets:
      links:
        - name: "C library, Linux amd64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/quip-solver-clib-${CI_COMMIT_TAG}-linux-amd64.tar.gz?job=release:clib"
          link_type: package
        - name: "C library checksum"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/quip-solver-clib-${CI_COMMIT_TAG}-linux-amd64.tar.gz.sha256?job=release:clib"
          link_type: other
