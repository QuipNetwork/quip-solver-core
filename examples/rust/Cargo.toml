# Empty table on purpose: this makes the example a standalone workspace rather
# than a member of the repository's, so it resolves quip-solver-core from
# crates.io like any external consumer would.
[workspace]

[package]
name = "quip-mock-miner-rust"
version = "0.1.0"
edition = "2021"
publish = false
description = "Sample Quip solver in Rust, built against the published crates.io release"

[dependencies]
# One dependency, and the published release rather than a path into this
# repository. quip-solver-core re-exports quip_proto and quip_protocol, so the
# consensus scorer needs no second crate that must move in lockstep.
quip-solver-core = "=0.0.0-rc6"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
# The conformance gate from SPEC section 6.
quip-solver-conformance = "=0.0.0-rc6"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[bin]]
name = "mock_miner"
path = "src/main.rs"
