syntax = "proto3";
package quip.v1;

service MinerService {
  rpc Session(stream MinerMsg) returns (stream CoordMsg);
}

enum Backend {
  BACKEND_UNSPECIFIED = 0;
  BACKEND_CPU = 1;
  BACKEND_CUDA = 2;
  BACKEND_METAL = 3;
  BACKEND_ANE = 4;
  BACKEND_DWAVE_QPU = 5;
  BACKEND_EXEC = 6;
  BACKEND_MOCK = 7;
}

enum Algorithm {
  ALGORITHM_UNSPECIFIED = 0;
  ALGORITHM_SA = 1;
  ALGORITHM_GIBBS = 2;
  ALGORITHM_QUANTUM_ANNEAL = 3;
  ALGORITHM_FSA = 4;
  ALGORITHM_MSA = 5;
  ALGORITHM_FLATIRON = 6;
  ALGORITHM_MPS = 7;
  ALGORITHM_MFA = 8;
  ALGORITHM_SB = 9;
  ALGORITHM_BSB = 10;
  ALGORITHM_GBSB = 11;
  ALGORITHM_GDSB = 12;
  ALGORITHM_GGDSB = 13;
  ALGORITHM_HBSB = 14;
  ALGORITHM_HDSB = 15;
  ALGORITHM_SBQA = 16;
  ALGORITHM_TEDSB = 17;
  ALGORITHM_EXTERNAL = 18;
}

enum CoefficientEncoding {
  COEFFICIENT_ENCODING_UNSPECIFIED = 0;
  COEFFICIENT_ENCODING_I32 = 1;
  COEFFICIENT_ENCODING_I16 = 2;
  COEFFICIENT_ENCODING_I8 = 3;
  COEFFICIENT_ENCODING_F16 = 4;
  COEFFICIENT_ENCODING_F32 = 5;
  COEFFICIENT_ENCODING_F64 = 6;
}

enum GeneratorAlgorithm {
  GENERATOR_ALGORITHM_UNSPECIFIED = 0;
  // nonce = BLAKE3(last_proof_block_hash || miner_account || salt).
  // ChaCha8 seeded with the nonce draws h for each node, then j for each
  // edge, each value allowed[next_u32 % len], in cached Topology order.
  GENERATOR_ALGORITHM_BLAKE3_CHACHA8_V1 = 1;
}

enum JobKind {
  JOB_KIND_UNSPECIFIED = 0;
  ISING_SAMPLE = 1;
  GATE_CIRCUIT = 2; // reserved
  ISING_GENERATE = 3;
}

enum RejectReason {
  REJECT_REASON_UNSPECIFIED = 0;
  UNSUPPORTED_KIND = 1;
  TOO_LARGE = 2;
  EXPIRED = 3;
  OVERLOADED = 4;
  SHUTTING_DOWN = 5;
  MALFORMED = 6;
  TOPOLOGY_MISMATCH = 7;
  TOPOLOGY_MISSING = 8;
  TARGET_MISSING = 9;
}

message MinerMsg {
  oneof msg {
    Hello      hello       = 1;
    Ready      ready       = 2;
    JobRequest job_request = 3;
    Result     result      = 4;
    Reject     reject      = 5;
    Status     status      = 6;
    Fatal      fatal       = 7;
    Capabilities capabilities = 8;
    LeaseDone lease_done = 9;
  }
}

message CoordMsg {
  oneof msg {
    Welcome   welcome   = 1;
    Configure configure = 2;
    Topology  topology  = 3;
    Job       job       = 4;
    Cancel    cancel    = 5;
    Ping      ping      = 6;
    Shutdown  shutdown  = 7;
    SetTarget set_target = 8;
    GetCapabilities get_capabilities = 9;
  }
}

message Hello {
  string miner_id = 1;
  string session_token = 2;
  reserved 3 to 10;
  reserved "protocol_version", "backend", "algorithm", "supported_kinds",
    "max_nodes", "max_edges", "native_topology_hash", "features";
  Capabilities capabilities = 11;
}

message Welcome { uint32 protocol_version = 1; }

message Configure {
  uint32 queue_depth    = 1;
  uint32 idle_timeout_s = 2;
  uint32 heartbeat_s    = 3;
  uint32 reconnect_window_s = 4;
  string backend_toml   = 5; // opaque per-backend config, passed through verbatim
}

message Ready {}

message Topology {
  bytes  hash  = 1;
  repeated uint32 nodes = 2;
  EdgeList edges = 3; // u/v are native node ids from Topology.nodes, not positions
  repeated int32 allowed_h_milli = 4; // for the miner's adapt difficulty band
  repeated int32 allowed_j_milli = 5;
}

// Difficulty target, pushed by the coordinator after Topology and re-sent
// whenever difficulty changes. The miner adapts its sampling budget from
// max_energy_milli; num_reads/num_sweeps/anneal_time_us are optional explicit
// overrides (0 = unset -> adapt).
message SetTarget {
  int64  max_energy_milli    = 1; // acceptance ceiling AND adapt target
  uint32 min_solutions       = 2;
  uint32 min_diversity_milli = 3;
  uint32 num_reads      = 4; // 0 = unset
  uint32 num_sweeps     = 5; // 0 = unset
  uint32 anneal_time_us = 6; // 0 = unset
  uint32 max_proof_solutions = 7;
}

message EdgeList {
  repeated uint32 u = 1;
  repeated uint32 v = 2;
}

message IsingProblem {
  oneof graph {
    bytes    topology_hash = 1;
    EdgeList edges         = 2; // u/v are dense positions into h, not node ids
  }
  reserved 3, 4, 6;
  reserved "h_milli_le32", "j_milli_le32", "gates";
  // h and j contain little-endian elements of encoding's type, one per node
  // and edge respectively, in EdgeList.u/v or cached Topology order.
  // Integer unit values are stored / scale, with
  // I32 at scale 1000 the canonical milli form. Float encodings use scale 0.
  // Reject unspecified encoding, invalid scale, partial elements, non-finite
  // floats, and values that do not convert exactly to i32 milli-units.
  CoefficientEncoding encoding = 13;
  uint32 scale = 14;
  bytes h = 15;
  bytes j = 16;
  uint32 num_reads      = 5; // per-job override; 0 = unset -> SetTarget/adapt
  uint32 num_sweeps     = 7; // per-job override; 0 = unset
  uint32 anneal_time_us = 8; // per-job override; 0 = unset

  // Optional warm-start states, one entry per seeded read, best state first.
  // Each entry is bit-packed in topology node order: node i is bit (i % 8) of
  // byte (i / 8), LSB first; bit 1 = spin +1, bit 0 = spin -1. An entry is
  // exactly ceil(num_nodes / 8) bytes and its padding bits are 0. Empty =
  // unset: the solver picks its own start. A solver that does not advertise
  // the `initial-spins` feature ignores this field and fields 10 to 12.
  repeated bytes initial_spins = 9;
  // Seeded SA: inverse temperature the anneal starts from, milli-units.
  // 0 = the solver picks. Ignored when initial_spins is empty.
  uint32 start_beta_milli = 10;
  // Seeded QPU: anneal fraction s the reverse anneal backs off to, in
  // milli-units (1..999). 0 = the solver picks. Ignored when initial_spins is
  // empty.
  uint32 reversal_s_milli = 11;
  // Seeded QPU: pause at the reversal point, microseconds. 0 = the solver
  // picks. Ignored when initial_spins is empty.
  uint32 reversal_pause_us = 12;
}

message Provenance {
  bool   is_pow   = 1;
  bytes  order_id = 2; // mempool reward attribution; empty for PoW
}

message Job {
  bytes   job_id      = 1;
  JobKind kind        = 2;
  uint64  generation  = 3; // PoW cancellation scope; 0 for mempool
  uint64  deadline_ms = 4;
  IsingProblem ising  = 5;
  Provenance provenance = 6;
  IsingProblemGenerator generator = 7; // ISING_GENERATE only
}

message JobRequest { uint32 credits = 1; }

message Cancel { uint64 max_generation = 1; }

message Ping {}

message Shutdown { uint32 grace_ms = 1; }

message Solution {
  reserved 1;
  reserved "spins_bytes";
  int64 energy_milli = 2;
  // Node i is bit i % 8 of byte i / 8, LSB first: 1 = +1, 0 = -1.
  // Exactly ceil(num_nodes / 8) bytes, with zero padding bits.
  bytes spins = 3;
}

message SamplerMeta {
  uint32 reads = 1;
  uint32 sweeps = 2;
  uint64 device_access_time_us = 3;
  uint64 qpu_access_us = 4;
  map<string, string> extra = 5;
}

message Result {
  bytes    job_id    = 1;
  repeated Solution solutions = 2;
  SamplerMeta meta   = 3;
  bytes salt = 4; // ISING_GENERATE only, 32 bytes
  bytes nonce = 5; // ISING_GENERATE only, 32 bytes
}

message Reject {
  bytes        job_id = 1;
  RejectReason reason = 2;
}

message Status {
  string miner_id     = 1;
  double utilization  = 2;
  uint64 jobs_done    = 3;
  uint64 abandoned_generation = 4; // cancelled in-flight work reported here, not in Result
  map<string, string> sampler_stats = 5;
}

message Fatal {
  uint32 exit_code = 1; // 64/69/70/77
  string reason    = 2;
  bool   restart_required = 3;
}

// Coordinator asks a miner what it currently supports. A miner may also send
// `Capabilities` unprompted when what it supports changes mid-session, for
// example a degraded device lowering `max_nodes`.
message GetCapabilities {}

// What a solver supports on this host. A caller uses it to decide whether to
// launch the binary at all, so it must answer without touching the device.
message Capabilities {
  reserved 1, 2;
  repeated JobKind supported_kinds = 3;
  uint32 max_nodes = 4;
  uint32 max_edges = 5;
  repeated string features = 6;   // initial-spins, streaming
  uint32 protocol_version = 7;    // this spec: 2
  uint32 stream_width = 8; // models kept in flight; 1 = serial
  optional bytes native_topology_hash = 9;
  repeated CoefficientEncoding encodings = 10;
  repeated GeneratorAlgorithm generators = 11;
  Backend backend = 12;
  Algorithm algorithm = 13;
}

message IsingProblemGenerator {
  GeneratorAlgorithm algorithm = 1;
  bytes  topology_hash = 2;          // cached Topology
  bytes  last_proof_block_hash = 3;  // 32 bytes
  bytes  miner_account = 4;          // 32 bytes
  bytes  base_salt = 5;              // 32 bytes
  uint64 salt_start = 6;
  uint64 salt_count = 7;
}

message LeaseDone {
  bytes  job_id = 1;
  uint64 salts_done = 2;
  int64  best_energy_milli = 3;
}
